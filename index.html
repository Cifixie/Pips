<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
/>
<meta property="og:title" content="Pips">
<meta property="og:description" content="A minimal match-three game. No levels, no lives, no power-ups.">
<meta property="og:url" content="https://pipfall.vercel.app/">
<title>Match Three</title>
<style>
  :root {
    --bg: #20252b;
    --panel: #2a3038;
    --slot: #232930;
    --ink: #eceae4;
    --muted: #8b949e;
    --gap: 6px;

    --c0: #e2574c;
    --c1: #e9a13b;
    --c2: #7fb069;
    --c3: #4e9dd9;
    --c4: #a67fc4;
    --c5: #dcd6c8;
  }
  * {
    box-sizing: border-box;
  }
  html,
  body {
    margin: 0;
    height: 100%;
  }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family:
      ui-sans-serif,
      system-ui,
      -apple-system,
      "Segoe UI",
      Roboto,
      sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 18px;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap {
    width: min(94vw, 460px);
  }

  header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .label {
    display: block;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 2px;
  }
  .score-row {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .score {
    font-size: 40px;
    line-height: 1;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum";
    letter-spacing: -0.02em;
  }
  .combo {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.06em;
    color: var(--c1);
    opacity: 0;
    transform: translateY(4px);
    transition:
      opacity 0.15s,
      transform 0.15s;
  }
  .combo.on {
    opacity: 1;
    transform: none;
  }

  .btn {
    font: inherit;
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    background: none;
    border: 1px solid #3b424b;
    border-radius: 999px;
    padding: 8px 14px;
    cursor: pointer;
  }
  .btn:hover {
    color: var(--ink);
    border-color: #59626d;
  }
  .btn:focus-visible {
    outline: 2px solid var(--c3);
    outline-offset: 2px;
  }

  .board {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: var(--gap);
    background: var(--panel);
    padding: var(--gap);
    border-radius: 10px;
    touch-action: none;
  }
  .board:focus-visible {
    outline: 2px solid var(--c3);
    outline-offset: 3px;
  }

  .cell {
    aspect-ratio: 1;
    background: var(--slot);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    cursor: pointer;
  }
  .pip {
    width: 76%;
    height: 76%;
    position: relative;
    background: var(--c);
    transition: transform 0.12s ease;
  }
  .cell[data-t="0"] .pip {
    border-radius: 50%;
  }
  .cell[data-t="1"] .pip {
    border-radius: 22%;
  }
  .cell[data-t="2"] .pip {
    clip-path: polygon(50% 6%, 94% 90%, 6% 90%);
  }
  .cell[data-t="3"] .pip {
    clip-path: polygon(50% 2%, 98% 50%, 50% 98%, 2% 50%);
  }
  .cell[data-t="4"] .pip {
    clip-path: polygon(50% 2%, 95% 26%, 95% 74%, 50% 98%, 5% 74%, 5% 26%);
  }
  .cell[data-t="5"] .pip {
    border-radius: 50%;
  }
  .cell[data-t="5"] .pip::after {
    content: "";
    position: absolute;
    inset: 32%;
    border-radius: 50%;
    background: var(--slot);
  }
  .cell[data-t="0"] {
    --c: var(--c0);
  }
  .cell[data-t="1"] {
    --c: var(--c1);
  }
  .cell[data-t="2"] {
    --c: var(--c2);
  }
  .cell[data-t="3"] {
    --c: var(--c3);
  }
  .cell[data-t="4"] {
    --c: var(--c4);
  }
  .cell[data-t="5"] {
    --c: var(--c5);
  }

  .cell.sel .pip {
    transform: scale(0.72);
  }
  .cell.sel::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 6px;
    border: 2px solid var(--ink);
  }
  .cell.cursor::before {
    content: "";
    position: absolute;
    inset: -3px;
    border-radius: 8px;
    border: 2px dashed var(--muted);
  }
  .cell.pop .pip {
    transform: scale(0);
    opacity: 0;
    transition:
      transform 0.16s ease-in,
      opacity 0.16s;
  }
  .cell.fall .pip {
    animation: fall 0.2s ease-out;
  }
  .cell.nudge {
    animation: nudge 0.22s;
  }

  @keyframes fall {
    from {
      transform: translateY(calc(-1 * var(--d) * (100% + var(--gap))));
    }
    to {
      transform: none;
    }
  }
  @keyframes nudge {
    25% {
      transform: translateX(-4px);
    }
    75% {
      transform: translateX(4px);
    }
  }

  .hint {
    margin: 14px 2px 0;
    font-size: 13px;
    color: var(--muted);
    min-height: 1.2em;
  }

  @media (prefers-reduced-motion: reduce) {
    .pip,
    .cell.pop .pip {
      transition: none;
    }
    .cell.fall .pip,
    .cell.nudge {
      animation: none;
    }
  }
</style>

<div class="wrap">
  <header>
    <div>
      <span class="label">Score</span>
      <div class="score-row">
        <span id="score" class="score">0</span>
        <span id="combo" class="combo"></span>
      </div>
    </div>
    <button id="newgame" class="btn">New game</button>
  </header>

  <div
    id="board"
    class="board"
    tabindex="0"
    role="grid"
    aria-label="Match three board"
  ></div>

  <p id="hint" class="hint">Swap two neighbours to line up three or more.</p>
</div>

<script>
  const N = 8,
    TYPES = 6;
  const boardEl = document.getElementById("board");
  const scoreEl = document.getElementById("score");
  const comboEl = document.getElementById("combo");
  const hintEl = document.getElementById("hint");

  let grid = [],
    cells = [],
    score = 0,
    sel = null,
    busy = false,
    cursor = 0;

  const at = (r, c) => r * N + c;
  const rc = (i) => [Math.floor(i / N), i % N];
  const rand = () => Math.floor(Math.random() * TYPES);
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));

  for (let i = 0; i < N * N; i++) {
    const d = document.createElement("div");
    d.className = "cell";
    d.dataset.i = i;
    d.setAttribute("role", "gridcell");
    d.innerHTML = '<span class="pip"></span>';
    boardEl.appendChild(d);
    cells.push(d);
  }

  function findMatches() {
    const hit = new Set();
    for (let r = 0; r < N; r++) {
      let run = 1;
      for (let c = 1; c <= N; c++) {
        const same = c < N && grid[at(r, c)] === grid[at(r, c - 1)];
        if (same) run++;
        else {
          if (run >= 3) for (let k = c - run; k < c; k++) hit.add(at(r, k));
          run = 1;
        }
      }
    }
    for (let c = 0; c < N; c++) {
      let run = 1;
      for (let r = 1; r <= N; r++) {
        const same = r < N && grid[at(r, c)] === grid[at(r - 1, c)];
        if (same) run++;
        else {
          if (run >= 3) for (let k = r - run; k < r; k++) hit.add(at(k, c));
          run = 1;
        }
      }
    }
    return hit;
  }

  function hasMove() {
    for (let r = 0; r < N; r++) {
      for (let c = 0; c < N; c++) {
        for (const [dr, dc] of [
          [0, 1],
          [1, 0],
        ]) {
          const r2 = r + dr,
            c2 = c + dc;
          if (r2 >= N || c2 >= N) continue;
          const a = at(r, c),
            b = at(r2, c2);
          [grid[a], grid[b]] = [grid[b], grid[a]];
          const ok = findMatches().size > 0;
          [grid[a], grid[b]] = [grid[b], grid[a]];
          if (ok) return true;
        }
      }
    }
    return false;
  }

  function fill() {
    do {
      grid = Array.from({ length: N * N }, rand);
      let guard = 0;
      let m = findMatches();
      while (m.size && guard++ < 400) {
        m.forEach((i) => (grid[i] = rand()));
        m = findMatches();
      }
    } while (!hasMove());
  }

  function paint(falls) {
    for (let i = 0; i < N * N; i++) {
      const el = cells[i];
      el.dataset.t = grid[i];
      el.classList.remove("pop", "fall");
      if (falls && falls[i]) {
        el.style.setProperty("--d", falls[i]);
        void el.offsetWidth;
        el.classList.add("fall");
      }
    }
    cells.forEach((el, i) => el.classList.toggle("sel", i === sel));
  }

  function collapse() {
    const falls = new Array(N * N).fill(0);
    for (let c = 0; c < N; c++) {
      let write = N - 1;
      for (let r = N - 1; r >= 0; r--) {
        const v = grid[at(r, c)];
        if (v !== null) {
          grid[at(write, c)] = v;
          falls[at(write, c)] = write - r;
          write--;
        }
      }
      for (let r = write; r >= 0; r--) {
        grid[at(r, c)] = rand();
        falls[at(r, c)] = write + 1;
      }
    }
    return falls;
  }

  async function resolve() {
    let chain = 0;
    while (true) {
      const hit = findMatches();
      if (!hit.size) break;
      chain++;
      score += hit.size * 10 * chain;
      scoreEl.textContent = score;
      if (chain > 1) {
        comboEl.textContent = "×" + chain + " chain";
        comboEl.classList.add("on");
      }
      hit.forEach((i) => cells[i].classList.add("pop"));
      await wait(170);
      hit.forEach((i) => (grid[i] = null));
      paint(collapse());
      await wait(200);
    }
    setTimeout(() => comboEl.classList.remove("on"), 700);

    if (!hasMove()) {
      hintEl.textContent = "No moves left — board reshuffled.";
      fill();
      paint();
    }
  }

  async function trySwap(a, b) {
    busy = true;
    sel = null;
    [grid[a], grid[b]] = [grid[b], grid[a]];
    if (findMatches().size) {
      paint();
      hintEl.textContent = "";
      await resolve();
    } else {
      [grid[a], grid[b]] = [grid[b], grid[a]];
      paint();
      cells[a].classList.add("nudge");
      cells[b].classList.add("nudge");
      hintEl.textContent = "That swap makes no line of three.";
      await wait(240);
      cells[a].classList.remove("nudge");
      cells[b].classList.remove("nudge");
    }
    busy = false;
  }

  const adjacent = (a, b) => {
    const [r1, c1] = rc(a),
      [r2, c2] = rc(b);
    return Math.abs(r1 - r2) + Math.abs(c1 - c2) === 1;
  };

  function pick(i) {
    if (busy) return;
    if (sel === null) {
      sel = i;
      paint();
      return;
    }
    if (sel === i) {
      sel = null;
      paint();
      return;
    }
    if (adjacent(sel, i)) trySwap(sel, i);
    else {
      sel = i;
      paint();
    }
  }

  // pointer: tap to select, or drag toward a neighbour
  let down = null;
  boardEl.addEventListener("pointerdown", (e) => {
    const cell = e.target.closest(".cell");
    if (!cell) return;
    down = { i: +cell.dataset.i, x: e.clientX, y: e.clientY };
  });
  boardEl.addEventListener("pointerup", (e) => {
    if (!down || busy) {
      down = null;
      return;
    }
    const dx = e.clientX - down.x,
      dy = e.clientY - down.y;
    const size = cells[0].offsetWidth;
    if (Math.hypot(dx, dy) > size * 0.4) {
      const [r, c] = rc(down.i);
      const [r2, c2] =
        Math.abs(dx) > Math.abs(dy)
          ? [r, c + Math.sign(dx)]
          : [r + Math.sign(dy), c];
      if (r2 >= 0 && r2 < N && c2 >= 0 && c2 < N) {
        sel = null;
        paint();
        trySwap(down.i, at(r2, c2));
      }
    } else {
      pick(down.i);
    }
    down = null;
  });

  // keyboard: arrows move, space or enter selects
  boardEl.addEventListener("keydown", (e) => {
    const [r, c] = rc(cursor);
    let nr = r,
      nc = c;
    if (e.key === "ArrowUp") nr--;
    else if (e.key === "ArrowDown") nr++;
    else if (e.key === "ArrowLeft") nc--;
    else if (e.key === "ArrowRight") nc++;
    else if (e.key === " " || e.key === "Enter") {
      e.preventDefault();
      pick(cursor);
      return;
    } else return;
    e.preventDefault();
    if (nr < 0 || nr >= N || nc < 0 || nc >= N) return;
    cells[cursor].classList.remove("cursor");
    cursor = at(nr, nc);
    cells[cursor].classList.add("cursor");
  });
  boardEl.addEventListener("focus", () =>
    cells[cursor].classList.add("cursor"),
  );
  boardEl.addEventListener("blur", () =>
    cells[cursor].classList.remove("cursor"),
  );

  document.getElementById("newgame").addEventListener("click", () => {
    if (busy) return;
    score = 0;
    sel = null;
    scoreEl.textContent = "0";
    comboEl.classList.remove("on");
    hintEl.textContent = "Swap two neighbours to line up three or more.";
    fill();
    paint();
  });

  fill();
  paint();
</script>
