<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <meta property="og:title" content="Pips" />
    <meta
      property="og:description"
      content="A minimal match-three game. No levels, no lives, no power-ups."
    />
    <meta property="og:url" content="https://pipfall.vercel.app/" />
    <title>Pips</title>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div>
          <span class="label">Score</span>
          <div class="score-row">
            <span id="score" class="score">0</span>
            <span id="combo" class="combo"></span>
          </div>
        </div>
        <button id="newgame" class="btn">New game</button>
      </header>

      <div
        id="board"
        class="board"
        tabindex="0"
        role="grid"
        aria-label="Match three board"
      ></div>

      <p id="hint" class="hint">
        Swap two neighbours to line up three or more.
      </p>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
