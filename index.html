<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <meta property="og:title" content="Pips" />
    <meta
      property="og:description"
      content="A minimal match-three game. No levels, no lives, no power-ups."
    />
    <meta property="og:url" content="https://pipfall.vercel.app/" />
    <title>Pips</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="wrap">
      <header>
        <div>
          <span class="label">Score</span>
          <div class="score-row">
            <span id="score" class="score">0</span>
            <span id="combo" class="combo"></span>
          </div>
        </div>
        <div class="hud">
          <div>
            <span class="label">Level</span>
            <div id="lvl" class="n">1</div>
          </div>
          <div>
            <span class="label">Moves</span>
            <div id="moves" class="n">18</div>
          </div>
          <button id="newgame" class="btn">Restart</button>
        </div>
      </header>

      <div class="goal">
        <span id="goalText" class="goal-text">Reach the target score</span>
        <span id="goalNum" class="goal-num"></span>
      </div>
      <div class="bar"><span id="barFill"></span></div>
      <div id="starRow" class="stars" aria-label="Star rating progress"></div>

      <div
        id="board"
        class="board"
        tabindex="0"
        role="grid"
        aria-label="Match three board"
      ></div>

      <p id="hint" class="hint">
        Swap two neighbours to line up three or more.
      </p>
    </div>

    <div id="ov" class="ov" hidden>
      <div class="card">
        <h2 id="ovTitle">Level clear</h2>
        <p id="ovSub" class="sub"></p>
        <div id="ovStars" class="stars"></div>
        <div id="ovLines" class="lines"></div>
        <div class="ovBtns">
          <button id="ovMain" class="btn solid">Next level</button>
          <button id="ovAlt" class="btn">Retry</button>
        </div>
      </div>
    </div>
    <script src="game.js"></script>
  </body>
</html>
